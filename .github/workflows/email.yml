name: E-Mail delivery

on:
  schedule:
    # Wednesdays and Fridays through the season, which runs from August to February.
    - cron: "0 6 * 8-12,1-2 3,5"

  workflow_dispatch:

jobs:
  delivery:
    name: Mail delivery
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Send a mail and wait for SMTP2GO to report it delivered
        run: yarn run test:delivery
        env:
          SMTP2GO_API_KEY: ${{ secrets.SMTP2GO_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
