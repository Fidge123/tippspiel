name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Check formatting and lint across the repo
        run: yarn run lint

  backend:
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint backend
        run: yarn run lint
      - name: Typecheck backend
        run: yarn run typecheck
      - name: Test backend
        run: yarn run test:unit
      - name: Build backend
        run: yarn run build

  api:
    name: API tests
    needs: backend
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Test the API
        run: yarn run test:api
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  season-replay:
    name: Season replay (2023)
    needs: api
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Restore fixture cache
        uses: actions/cache@v6
        with:
          path: backend/test/.corpus-cache
          key: corpus-2023-${{ hashFiles('backend/test/replay/season.ts') }}
      - name: Replay the season
        run: yarn run test:replay
        env:
          # Object Read on the nfl-tippspiel bucket only.
          R2_API: ${{ secrets.R2_API }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  frontend:
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint frontend
        run: yarn run lint
      - name: Typecheck frontend
        run: yarn run typecheck
      - name: Test frontend
        run: yarn run test
      - name: Build frontend
        run: yarn run build
      - name: Archive build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: frontend/build
          retention-days: 2
